<div class="container">

  <h1 style="text-align: center;">User Registration</h1>

 <form class="registration-form" #userForm="ngForm" (ngSubmit)="onRegister(userForm)">

  <label for="name">Name</label>
  <input id="name" name="name" type="text" maxlength="30" placeholder="Enter Name" ngModel required #name="ngModel"/>
  
  <br/>

  <label for="email">Email</label>
  <input id="email" name="email" type="email" maxlength="30" placeholder="Enter Email" ngModel required email #email="ngModel"/>
  <div *ngIf="email.invalid && email.touched" style="color: red; font-size: 0.95em;">
    <span *ngIf="email.errors?.['required']">Email is required.</span>
    <span *ngIf="email.errors?.['email']">Enter a valid email address.</span>
  </div>
  <br/>

  <label for="phoneNumber">Phone Number</label>
  <input id="phoneNumber" name="phoneNumber" type="text" maxlength="15" placeholder="Enter Phone Number" ngModel required pattern="^[1-9][0-9]{9,14}$" #phoneNumber="ngModel"/>
  <div *ngIf="phoneNumber.invalid && phoneNumber.touched" style="color: red; font-size: 0.95em;">
    <span *ngIf="phoneNumber.errors?.['required']">Phone number is required.</span>
    <span *ngIf="phoneNumber.errors?.['pattern']">Enter a valid phone number.</span>
  </div>
  <br/>

  <label for="password">Password</label>
  <input id="password" name="password" type="password" maxlength="30" placeholder="Enter Password" ngModel required minlength="6" #password="ngModel"/>
  <div *ngIf="password.invalid && password.touched" style="color: red; font-size: 0.95em;">
    <span *ngIf="password.errors?.['required']">Password is required.</span>
    <span *ngIf="password.errors?.['minlength']">Password must be at least 6 characters.</span>
  </div>
  <br/>

  <button type="submit" [disabled]="userForm.invalid">Register</button>
</form>
</div>
