<div class="container">

  <h1 style="text-align: center;">User Registration</h1>

  <form class="registration-form" #userForm="ngForm" (ngSubmit)="onRegister(userForm)">
    
    <label for="name">Name</label>
    <input id="name" name="name" type="text" maxlength="30" placeholder="Enter Name" ngModel />
    <br/>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" maxlength="30" placeholder="Enter Email" ngModel />
    <br/>

    <label for="phoneNumber">Phone Number</label>
    <input id="phoneNumber" name="phoneNumber" type="text" maxlength="15" placeholder="Enter Phone Number" ngModel />
    <br/>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" maxlength="30" placeholder="Enter Password" ngModel />
    <br/>
    
    <button type="submit">Register</button>
  </form>
</div>
